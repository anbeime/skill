  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 14px; }
  #read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] {
    flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  #play[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #means { margin: 14px 0 0; text-wrap: pretty; }
  #rules { margin: 6px 0 0; line-height: 1.6; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
</head>
<body>
<main>
  <div class="plate">
    <span class="tag" id="name"></span>
    <span class="tag" id="read"></span>
    <div id="stage"></div>
  </div>
  <div class="controls">
    <label class="label" for="intensity">intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <span class="label">theme</span>
    <button id="theme" type="button" aria-label="Switch between the light and the dark theme"></button>
    <span class="label">play</span>
    <button id="play" type="button" aria-pressed="false">play</button>
  </div>
  <p id="means"></p>
  <p id="rules" class="label"></p>
  <p id="error" role="alert" hidden></p>
</main>

    const els = [mk("path", { class: "sil" }, parent), mk("path", { class: "fo" }, parent), mk("path", { class: "sil nf" }, parent), mk("path", { class: cls }, parent)];
    if (s) els.forEach((el, i) => el.setAttribute("d", s[i]));
    return els;
  };

  // the page: a thin standing sheet, its top bar (three dots, the address pill), and the picture's drawing
  const edge = rrect(0, 0, PW, PH, 2, 3);
  draw(g, slab(ring(edge), ring(edge, -D)));
  const dot = (u, t, r) => poly(Array.from({ length: 12 }, (_, k) => W(u + r * Math.cos(rad(k * 30)), t + r * Math.sin(rad(k * 30)))));
  mk("path", { class: "nf lo", d: [7, 12, 17].map((u) => dot(u, 7, 1.3)).join("") + poly(ring(rrect(24, 4.5, 88, 9.5, 2.5))) + seg(W(0, 14), W(PW, 14)) }, g);
  const art = mk("path", { class: "nf lo", d: open([[11, 78], [21, 67], [27, 72], [36, 62], [49, 78]].map(([u, t]) => W(u, t))) + dot(18, 63, 2.4) }, g);

  // where each part was: a dashed ghost on the face, under the part itself
  const ghosts = mk("path", { class: "nf lo dash" }, g);
  // the read-line across the face, a tick standing at each edge
  const line = mk("path", { class: "sil" }, g);

  // the sheet at the page's foot, which feeds out as parts land on it
  const sheet = solid(g), rowX = ITEMS.map((_, k) => DX0 + 8 + k * 7 + (k ? 3 : 0)), grow = spring(rowX[0] + 7, { k: 40, c: 13 });
  let sheetAt = NaN;

  // each part: on the page it lies on the face; peeling, its far end leads, twisting flat; landed it lies on the sheet
  const strips = mk("g", {}, g);
  const items = ITEMS.map(([kind, u0, u1, t], k) => {
    const [r0, r1, y0, l1] = KIND[kind];
    return { kind, u0, u1, t, r0, r1, x1: rowX[k], y1: YL - y0, len: l1 || (u1 - u0) * K,
      el: mk("path", { class: kind === 0 ? "sil" : kind === 2 ? "nf lo" : "lo" }, strips), tw: tween(k === 0 ? 1 : 0, fly), drawn: NaN, read: k === 0 };
  });
  ghosts.setAttribute("d", items.map((it) => it.r0
    ? poly([[it.u0, it.t - it.r0], [it.u1, it.t - it.r0], [it.u1, it.t + it.r0], [it.u0, it.t + it.r0]].map(([u, t]) => W(u, t, 0.2)))
    : seg(W(it.u0, it.t, 0.2), W(it.u1, it.t, 0.2))).join(""));

  /** A point of a part at s along it (0 its near end, 1 its far end), q of the way from the page to the sheet, lifted on the way. */
  function at3(it, s, q, dp = 0, ds = 0) {
    const p = [0.3, PW / 2 - it.u0 - (it.u1 - it.u0) * s + dp, PH - it.t], w = [it.x1, it.y1 - it.len * s + ds, DT + 0.2];
    return p.map((v, i) => v + (w[i] - v) * q + (i === 2 ? 14 * Math.sin(Math.PI * q) : 0));
  }
  /** Across the part at q: upright on the page, lying on the sheet. */
  const across = (q, r) => [r * Math.sin((Math.PI / 2) * q), 0, r * Math.cos((Math.PI / 2) * q)];
  const off = (c, h, m = 1) => P(...c.map((v, i) => v + h[i] * m));
  function paintItem(it, e) {
    if (it.drawn === e) return;
    it.drawn = e;
    const side = [], back = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N, q = clamp(e * (1 + LAG) - LAG * (1 - s), 0, 1), c = at3(it, s, q);
      const h = across(q, it.r0 + (it.r1 - it.r0) * q + 1.3 * Math.sin(Math.PI * q));
      side.push(off(c, h)); back.unshift(off(c, h, -1));
    }
    let d = poly([...side, ...back]);
    const q = clamp(e * (1 + LAG) - LAG, 0, 1);
    if (it.kind === 3 || (it.kind === 2 && q > 0)) {
      // its mark before it: a list item's bullet that becomes a dash; the picture's square, only once it leaves
      const c = at3(it, 0, q, 4, 4.5), h = across(q, 1);
      const [ml, mw] = it.kind === 3 ? [0.9 + 0.7 * q, 0.9 - 0.3 * q] : [2.2 * q, 2.2 * q];
      d += poly([[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) => P(c[0] + h[0] * mw * b, c[1] - ml * a, c[2] + h[2] * mw * b)));
    }
    it.el.setAttribute("d", d);
  }

  // the head: the read-line at t down the page, the flame floating in front over its right end
  const flame = draw(g, null, "sil hi");
  const pos = spring(REST, { k: 30, c: 11 });
  let hover = false, drawnT = NaN, count = -1;
  function paintHead(t) {
    if (t === drawnT) return;
    drawnT = t;
    line.setAttribute("d", seg(W(-3, t, 0.4), W(PW + 3, t, 0.4)) + seg(W(-3, t - 3, 0.4), W(-3, t + 3, 0.4)) + seg(W(PW + 3, t - 3, 0.4), W(PW + 3, t + 3, 0.4)));
    const z = PH - t + 4 + 8 * FS, y = PW / 2 - UF, r = Math.SQRT1_2;
    const pts = (n) => F.map(([a, b]) => P(XF + (a + n) * r, y - (a - n) * r, z - b));
    slab(pts(1.5), pts(-1.5)).forEach((d, i) => flame[i].setAttribute("d", d));
  }

  const B = register(stage, (dt, now) => {
    let moving = stepS(pos, dt);
    paintHead(pos.x);
    let n = 0;
    items.forEach((it) => {
      const r = pos.x >= it.t - 2;
      if (r !== it.read) { it.read = r; it.tw.dur = fly; tset(it.tw, r ? 1 : 0, now, 0); }
      if (it.read) n++;
      paintItem(it, tval(it.tw, now));
      if (!tdone(it.tw, now)) moving = true;
    });
    art.classList.toggle("dash", items[4].read);
    grow.t = rowX[Math.max(0, n - 1)] + 7;
    if (stepS(grow, dt)) moving = true;
    if (grow.x !== sheetAt) { sheetAt = grow.x; put(sheet, prism(P, front, ...rings(DX0, YR, sheetAt, YL, 4, 2), 0, DT)); }
    if (n !== count) { count = n; read.textContent = hover ? `${n} lines` : "rest"; }
    return moving;
  });
  bag.add(B.unregister);

  /** The pointer, put on the page's plane (x 0), which never moves: its height there is how far down to read. */
  const zf = Math.sqrt(1 - C.k * C.k), cs = Math.cos(C.az), sn = Math.sin(C.az);
  function aim(p) {
    hover = p !== null;
    if (hover) { const y = -(p[0] - C.ox) / (C.S * sn), z = (y * cs * C.k - (p[1] - C.oy) / C.S) / zf; pos.t = clamp(PH - z, T0, T1); }
    else pos.t = REST;
    flame[3].classList.toggle("hi", !hover);
    line.classList.toggle("hi", hover);
    count = -1;
    B.wake();
  }
  bag.add(pointer(stage, { move: (p) => aim(p), leave: () => aim(null) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { fly = v; },
    destroy: bag.dispose,
  };
}

hairline({
  name: "firecrawl-reader",
  means: "The flame reads a page: point down the page, and every part it passes peels off and settles, in order, on a sheet of markdown.",
  rules: [1, 5, 8, 10],
  range: [400, 700, 1000],
  tour: [[200, 110], [200, 170], [200, 230], null],
  mount,
});
</script>
</body>
