  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 14px; }
  #read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] {
    flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  #play[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #means { margin: 14px 0 0; text-wrap: pretty; }
  #rules { margin: 6px 0 0; line-height: 1.6; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
</head>
<body>
<main>
  <div class="plate">
    <span class="tag" id="name"></span>
    <span class="tag" id="read"></span>
    <div id="stage"></div>
  </div>
  <div class="controls">
    <label class="label" for="intensity">intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <span class="label">theme</span>
    <button id="theme" type="button" aria-label="Switch between the light and the dark theme"></button>
    <span class="label">play</span>
    <button id="play" type="button" aria-pressed="false">play</button>
  </div>
  <p id="means"></p>
  <p id="rules" class="label"></p>
  <p id="error" role="alert" hidden></p>
</main>

  const onBelt = mk("g", {}, g);

  // the tray: an open box whose near walls are drawn again over what lies in it
  const tray = mk("g", {}, g);
  const outer = rr(TX0, -TY, TX1, TY, 5), inner = rr(TX0 + 3, -TY + 3, TX1 - 3, TY - 3, 2.5);
  put(solid(tray), prism(P, front, outer, null, 0, RIM));
  mk("path", { class: "nf lo", d: poly(ring(inner, RIM)) }, tray);
  const inTray = mk("g", {}, g);
  const lip = mk("g", {}, g), of = frontRun(outer), inf = frontRun(inner);
  mk("path", { class: "fo", d: poly([...ring(of, 0), ...ring(of, RIM).reverse()]) + poly([...ring(of, RIM), ...ring(inf, RIM).reverse()]) }, lip);
  mk("path", { class: "sil nf", d: open(ring(of, 0)) + seg(ring(of, 0)[0], ring(of, RIM)[0]) + seg(ring(of, 0)[of.length - 1], ring(of, RIM)[of.length - 1]) + open(ring(of, RIM)) }, lip);
  mk("path", { class: "nf lo", d: open(ring(inf, RIM)) }, lip);

  /** A letter: its three paths, drawn at (x, y, z) turned by h. */
  const letter = (parent) => { const grp = mk("g", {}, parent); return { grp, under: mk("path", { class: "lo" }, grp), body: mk("path", { class: "sil" }, grp), flap: mk("path", { class: "nf lo" }, grp) }; };
  function paint(L, x, y, z, h, slot) {
    const c = Math.cos(h), s = Math.sin(h), at = (pts) => pts.map(([a, b]) => [x + a * c - b * s, y + a * s + b * c]);
    // in the slot, what is still inside is pressed flat against its mouth: a straight cut, since the letter is square to it
    const hide = slot && x + 10 <= W, on = (pts, zz) => (hide ? "" : pts.map(([px, py]) => P(slot ? Math.max(px, W) : px, py, zz)));
    L.under.setAttribute("d", hide ? "" : poly(on(at(BODY), z - LIFT)));
    L.body.setAttribute("d", hide ? "" : poly(on(at(BODY), z)));
    L.flap.setAttribute("d", hide ? "" : open(on(at(FLAP), z)));
  }

  // letters: on the belt they ride at s - e; past its end they hop into the tray; in it they lie stacked
  let s = 0, sent = 0, hover = false;
  const vel = spring(0, { k: 30, c: 11 });
  const jitter = (k) => [((k * 37) % 11) - 5, ((k * 53) % 13) - 6, rad(((k * 29) % 17) - 8)];
  const riding = [{ e: -GAP, ...letter(onBelt) }], hopping = [], lying = [0, 1].map((k) => ({ ...letter(inTray), k }));
  sent = 2;

  // the letter d down a pile of n: the top ones askew, the deeper ones squared up under each other
  function trayAt(L, d, n) {
    const [jx, jy, jh] = jitter(L.k), f = clamp(1 - d / (KEEP - 1), 0, 1);
    return [(TX0 + TX1) / 2 + jx * f, jy * f, LIFT + 0.6 + Math.max(0, Math.min(n, KEEP) - 1 - d) * 1.2, jh * f];
  }
  const settle = (L, to, k) => { L.at = L.at ? L.at.map((v, i) => v + (to[i] - v) * k) : to; return to.some((v, i) => Math.abs(v - L.at[i]) > 0.02); };
  function lit() {
    const all = [...riding, ...hopping, ...lying];
    all.forEach((L) => L.body.classList.toggle("hi", false));
    face.classList.toggle("hi", !hover);
    if (hover && riding.length) riding[riding.length - 1].body.classList.toggle("hi", true);
  }

  function frame(dt, now) {
    let moving = stepS(vel, dt);
    s += vel.x * dt;
    // a new letter comes out as soon as the last one is a gap clear of the slot
    if (hover) {
      const last = riding[riding.length - 1];
      if (!last || s - last.e >= GAP) { riding.push({ e: last ? last.e + GAP : s, ...letter(onBelt) }); lit(); }
    }
    // a letter whose middle reaches the end of the belt leaves it for the tray
    while (riding.length && X0 + s - riding[0].e >= XE - 4) {
      const L = riding.shift();
      onBelt.removeChild(L.grp); inTray.append(L.grp);
      Object.assign(L, { k: sent++, t0: now, x0: XE - 4 });
      hopping.push(L);
    }
    // the slats come up out of the slot and go down over the far end: each narrows to nothing as it nears an end
    const slatPh = ((s % 12) + 12) % 12;
    slats.forEach((el, k) => { const x = W + slatPh + k * 12, hw = (BW - 2) * clamp(Math.min(x - W, XE - x) / 8, 0, 1);
      el.setAttribute("d", hw > 0.3 ? seg(P(x, -hw, BH), P(x, hw, BH)) : ""); });
    riding.forEach((L) => paint(L, X0 + s - L.e, 0, BH + LIFT, 0, true));
    // the hop: an arc over the rim, eased in and out, so it leaves the belt and lands on the pile without a knock
    hopping.slice().forEach((L) => {
      const p = clamp((now - L.t0) / HOP, 0, 1), e = p * p * (3 - 2 * p), [tx, ty, tz, th] = trayAt(L, 0, lying.length + 1);
      L.at = [L.x0 + (tx - L.x0) * e, ty * e, BH + LIFT + (tz - BH - LIFT) * e + 7 * Math.sin(Math.PI * e), th * e];
      if (p < 1) { moving = true; return; }
      hopping.splice(hopping.indexOf(L), 1);
      lying.push(L);
      // the tray keeps the last few: the oldest lies exactly under the next by now, so it goes unseen
      if (lying.length > KEEP + 1) lying.shift().grp.remove();
      read.textContent = hover ? `${sent} sent` : "rest";
    });
    // the pile eases to where it lies: each one settles down a step and squares up as a new one lands on it
    const n = lying.length, k = 1 - Math.exp(-dt * 7);
    lying.forEach((L, i) => { if (settle(L, trayAt(L, n - 1 - i, n), k)) moving = true; });
    [...hopping, ...lying].forEach((L) => paint(L, L.at[0], L.at[1], L.at[2], L.at[3], false));
    if (hover) moving = true;
    return moving;
  }

  const B = register(stage, frame);
  bag.add(B.unregister);

  function run(on) {
    if (on === hover) return;
    hover = on;
    vel.t = on ? speed : 0;
    read.textContent = on ? `${sent} sent` : "rest";
    lit();
    B.wake();
  }
  bag.add(pointer(stage, { move: () => run(true), leave: () => run(false) }));
  bag.add(() => svg.replaceChildren());
  lit();

  return {
    set: (v) => { speed = v; if (hover) { vel.t = v; B.wake(); } },
    destroy: bag.dispose,
  };
}

hairline({
  name: "resend-belt",
  means: "The R on its block: while the pointer is over it, the belt runs and the letters come out from under it into the tray.",
  rules: [5, 8, 10],
  range: [30, 45, 60],
  tour: [[200, 160], [260, 200], null],
  mount,
});
</script>
