  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 14px; }
  #read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] {
    flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  #play[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #means { margin: 14px 0 0; text-wrap: pretty; }
  #rules { margin: 6px 0 0; line-height: 1.6; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
</head>
<body>
<main>
  <div class="plate">
    <span class="tag" id="name"></span>
    <span class="tag" id="read"></span>
    <div id="stage"></div>
  </div>
  <div class="controls">
    <label class="label" for="intensity">intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <span class="label">theme</span>
    <button id="theme" type="button" aria-label="Switch between the light and the dark theme"></button>
    <span class="label">play</span>
    <button id="play" type="button" aria-pressed="false">play</button>
  </div>
  <p id="means"></p>
  <p id="rules" class="label"></p>
  <p id="error" role="alert" hidden></p>
</main>

    const wL = WM * clamp((u - ub) / (UJ - ub), 0.25, 1) * (0.4 + 0.6 * clamp(2 * n - 1, 0, 1));
    // Each part's distance, into one buffer: the five spheres, the M's three necks, the foot's.
    const ds = (x, y) => {
      for (let i = 0; i < 5; i++) { const a = x - cs[i][0], b = y - cs[i][1]; D[i] = Math.sqrt(a * a + b * b) - rs; }
      for (let i = 0; i < 3; i++) D[5 + i] = rod(x, y, cs[i], cs[i + 1], 0, 1, WM);
      D[8] = n > 0.002 ? Math.min(rod(x, y, cs[0], cs[4], 0, m, wL), rod(x, y, cs[0], cs[4], 1 - m, 1, wL)) : 1e3;
      return D;
    };
    const field = (d) => { let v = d[0]; for (let i = 1; i < 9; i++) v = smin(v, d[i], KS); return v; };
    const f = (x, y) => field(ds(x, y));
    const xs = cs.map((c) => c[0]), ys = cs.map((c) => c[1]), x0 = Math.min(...xs) - rs - 4, y0 = Math.min(...ys) - rs - 4;
    const loops = trace(f, x0, y0, Math.ceil((Math.max(...xs) + rs + 4 - x0) / G), Math.ceil((Math.max(...ys) + rs + 4 - y0) / G));
    out.setAttribute("d", loops.map(poly).join(""));
    // The bright run: the lone sphere's outline, and once joined, the neck it grew with it.
    const lit = ([x, y]) => {
      const d = ds(x, y), o = conn ? Math.min(d[4], d[8]) : d[4];
      return Math.min(d[0], d[1], d[2], d[3], d[5], d[6], d[7]) >= o;
    };
    let h = "";
    for (const loop of loops) {
      const on = loop.map(lit), s = on.findIndex((x, i) => x && !on[(i + loop.length - 1) % loop.length]);
      if (on.every(Boolean)) { h += poly(loop); continue; }
      if (s < 0) continue;
      for (let i = 0, run = []; i <= loop.length; i++) {
        const k = (s + i) % loop.length;
        if (i < loop.length && on[k]) run.push(loop[k]); else { if (run.length > 1) h += open(run.concat([loop[k]])); run = []; }
      }
    }
    hi.setAttribute("d", h);
    // A dim crease along each sphere's lower side, broken where a neck leaves it.
    let d = "";
    cs.forEach((c, ci) => {
      let run = [];
      for (let i = 0; i <= 20; i++) {
        const t = ((28 + i * 6.2) * Math.PI) / 180, p = [c[0] + (rs - 2.6) * Math.cos(t), c[1] + (rs - 2.6) * Math.sin(t)], e = ds(...p);
        if (field(e) < e[ci] - 0.3 || Math.min(...e) < e[ci]) { if (run.length > 1) d += open(run); run = []; } else run.push(p);
      }
      if (run.length > 1) d += open(run);
    });
    cr.setAttribute("d", d);
  }

  const B = register(stage, (dt, now) => {
    let moving = stepS(lone, dt);
    for (const t of tug) if (stepS(t, dt)) moving = true;
    const n = tval(nw, now), key = [lone.x, n, ...tug.map((t) => t.x)].map((v) => v.toFixed(3)).join() + conn;
    if (key !== last) { last = key; draw(lone.x, n); }
    return moving || !tdone(nw, now);
  });
  bag.add(B.unregister);
  draw(U0, 0);

  function retarget() {
    if (over === null) { lone.t = U0; conn = false; } else {
      lone.t = clamp(over + UJ - U0 + 2, U0 - stretch - 4, UJ);
      if (!conn && lone.t >= UF) conn = true;
      else if (conn && lone.t < U0 - stretch) conn = false;
    }
    // Joined, the chain leans to its foot, and the more the neck is stretched the more,
    // each sphere less the farther along the chain it is.
    const pull = conn ? clamp(2.2 + (UJ - lone.t) * 0.2, 0, 5) : 0;
    tug.forEach((t, i) => { t.t = pull * PULL[i]; });
    tset(nw, conn ? 1 : 0, performance.now(), 0);
    read.textContent = over === null ? "rest" : `agent · ${conn ? 1 : 0}`;
    B.wake();
  }

  // The pointer's x, read as a place on the board's line at the spheres' height. On the
  // lone sphere or right of it, the sphere is drawn in; left of it, the sphere follows.
  const s0 = S(0, R)[0], s1 = S(1, R)[0];
  bag.add(pointer(stage, {
    move: (p) => { over = (p[0] - s0) / (s1 - s0); retarget(); },
    leave: () => { over = null; retarget(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { stretch = v; if (over !== null) retarget(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "mastra",
  means: "No agents connected: the pointer draws the lone sphere to the M, a neck forms, stretches, and lets go.",
  rules: [3, 4, 5, 8],
  range: [4, 9, 14],
  tour: [[80, 160], [240, 160], null],
  mount,
});
</script>
