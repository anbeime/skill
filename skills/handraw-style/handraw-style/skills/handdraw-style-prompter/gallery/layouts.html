(function() {
  function fixImg(img) {
    if (!img || img.__fixed) return;
    var src = img.getAttribute('src') || '';
    var idx = src.indexOf('images/');
    if (idx === -1) return;
    if (location.protocol === 'file:') {
      var key = src.substring(idx + 'images/'.length);
      var thumbnail = window.handrawThumbnails?.[key];
      if (thumbnail) {
        img.src = thumbnail;
        return;
      }
    }
    var sub = src.substring(idx);
    var step = parseInt(img.dataset.retry || '0', 10);
    var candidates = [
      '../../../../' + sub,
      '../../../' + sub,
      '../../' + sub,
      '../' + sub,
      './' + sub,
      '/' + sub,
      'https://img.handraw-style.com/' + sub,
      'https://raw.githubusercontent.com/yang0/handraw-style/master/' + sub
    ];
    while (step < candidates.length) {
      var nextSrc = candidates[step];
      step++;
      if (nextSrc !== src) {
        img.dataset.retry = step.toString();
        img.src = nextSrc;
        return;
      }
    }
    img.__fixed = true;
  }
  window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'IMG') {
      fixImg(e.target);
    }
  }, true);
  window.addEventListener('load', function(e) {
    if (e.target && e.target.tagName === 'IMG') {
      var card = e.target.closest('.style-card, .layout-card, .color-card, .asset-card');
      if (card && e.target.src) {
        card.dataset.image = e.target.src;
      }
    }
  }, true);
})();
</script>

<button class="layout-card" type="button" data-id="SB-069" data-category="comic-storyboard" data-image="../../../images/layouts/comic-storyboards/SB-069.webp" data-prompt="采用竖版上下两格漫画布局，两格大小一致，纵向排列。整体背景色和文字区背景色一致。
每格都采用上图下文的结构，上方约80%的区域为完整的场景插画，下方约20%的区域为横向文字说明栏。
图片占满上方区域左右无边框，文字栏紧贴图片底部，使用浅色背景。文字左对齐，以阿拉伯数字编号开头。
上下两格之间用细横线分隔，保持统一的图片比例、文字栏高度和左右边距。每格表现一个独立的生活场景，整体布局简洁规整，不添加额外装饰。" data-prompt-zh="采用竖版上下两格漫画布局，两格大小一致，纵向排列。整体背景色和文字区背景色一致。

Each panel uses an &quot;image on top, text below&quot; structure: the upper ~80% area is a complete scene illustration, and the lower ~20% area is a horizontal caption bar.

<button class="layout-card" type="button" data-id="EC-001" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-001.webp" data-prompt="电商单品主图。核心任务：第一眼看清商品。受众：{由用户输入，或根据商品与用户资料总结图片受众}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。必须保留的商品识别信息：{由根据参考图或资料总结；如无特殊要求则留空}。其余画面表现请围绕“主体清晰、商品突出、第一眼看懂商品”完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商单品主图。核心任务：第一眼看清商品。受众：{由用户输入，或根据商品与用户资料总结图片受众}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。必须保留的商品识别信息：{由根据参考图或资料总结；如无特殊要求则留空}。其余画面表现请围绕“主体清晰、商品突出、第一眼看懂商品”完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce single product hero image. Core task: Clearly present the product at first glance. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Mandatory product identification features: {Summarized based on reference image or data; leave blank if no special requirements}. Render the rest of the visual presentation around &quot;clear subject, prominent product, immediately understandable at first glance&quot;. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="单品主图" data-name-zh="单品主图" data-name-en="Single Product Hero Image" aria-label="查看 EC-001 单品主图"><img src="../../../images/layouts/ecommerce/EC-001.webp" alt="EC-001 单品主图"><span class="layout-info"><span class="layout-id">EC-001</span><span class="layout-name">单品主图</span></span></button>
<button class="layout-card" type="button" data-id="EC-002" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-002.webp" data-prompt="电商多角度展示图。核心任务：让用户快速看清商品整体结构与不同视角。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。需要重点展示的角度或结构：{由用户指定；若未指定，由根据商品形态判断最有信息价值的视角}。其余多视角组织方式与画面表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商多角度展示图。核心任务：让用户快速看清商品整体结构与不同视角。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。需要重点展示的角度或结构：{由用户指定；若未指定，由根据商品形态判断最有信息价值的视角}。其余多视角组织方式与画面表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce multi-angle display image. Core task: Allow users to quickly see the overall product structure and different perspectives. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Angles or structures to emphasize: {Specified by user; if unspecified, determine the most informative angles based on product morphology}. Autonomously arrange the multi-angle composition and visual presentation. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="多角度展示图" data-name-zh="多角度展示图" data-name-en="Multi-Angle Display Image" aria-label="查看 EC-002 多角度展示图"><img src="../../../images/layouts/ecommerce/EC-002.webp" alt="EC-002 多角度展示图"><span class="layout-info"><span class="layout-id">EC-002</span><span class="layout-name">多角度展示图</span></span></button>
<button class="layout-card" type="button" data-id="EC-003" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-003.webp" data-prompt="电商细节特写图。核心任务：突出商品最值得关注的局部细节、做工或质感。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。重点细节：{由用户指定；若未指定，由根据商品资料提炼最值得展示的真实细节}。其余特写视角、取景、光线与质感表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商细节特写图。核心任务：突出商品最值得关注的局部细节、做工或质感。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。重点细节：{由用户指定；若未指定，由根据商品资料提炼最值得展示的真实细节}。其余特写视角、取景、光线与质感表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce detail closeup image. Core task: Highlight the product&#x27;s most notable local details, craftsmanship, or material texture. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Key details: {Specified by user; if unspecified, extract the most valuable authentic details based on product data}. Autonomously determine the closeup angles, framing, lighting, and texture rendering. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="细节特写图" data-name-zh="细节特写图" data-name-en="Detail Closeup Image" aria-label="查看 EC-003 细节特写图"><img src="../../../images/layouts/ecommerce/EC-003.webp" alt="EC-003 细节特写图"><span class="layout-info"><span class="layout-id">EC-003</span><span class="layout-name">细节特写图</span></span></button>
<button class="layout-card" type="button" data-id="EC-004" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-004.webp" data-prompt="电商包装、套装与内容物展示图。核心任务：让用户快速看清购买后实际获得的商品、包装、配件或组合内容。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品与内容物：{从用户输入、商品清单或参考资料中提取，不得补造不存在的配件或赠品}。其余陈列方式、层级关系与视觉组织请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商包装、套装与内容物展示图。核心任务：让用户快速看清购买后实际获得的商品、包装、配件或组合内容。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品与内容物：{从用户输入、商品清单或参考资料中提取，不得补造不存在的配件或赠品}。其余陈列方式、层级关系与视觉组织请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce packaging, set, and contents display image. Core task: Let users quickly see what is actually included upon purchase—products, packaging, accessories, or bundled items. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product and contents: {Extracted from user input, product list, or reference data; do not invent non-existent accessories or gifts}. Autonomously arrange display composition, hierarchical relations, and visual layout. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="包装 / 套装 / 内容物展示图" data-name-zh="包装 / 套装 / 内容物展示图" data-name-en="Packaging / Set / Contents Display Image" aria-label="查看 EC-004 包装 / 套装 / 内容物展示图"><img src="../../../images/layouts/ecommerce/EC-004.webp" alt="EC-004 包装 / 套装 / 内容物展示图"><span class="layout-info"><span class="layout-id">EC-004</span><span class="layout-name">包装 / 套装 / 内容物展示图</span></span></button>
<button class="layout-card" type="button" data-id="EC-005" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-005.webp" data-prompt="电商卖点标注图。核心任务：快速传达商品最重要的购买理由。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。核心卖点：{优先使用用户提供内容；若未明确，从商品资料中提炼 3～5 个真实卖点}。卖点优先级：{由根据目标受众与购买决策价值排序}。其余标注方式、视觉层级与画面表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商卖点标注图。核心任务：快速传达商品最重要的购买理由。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。核心卖点：{优先使用用户提供内容；若未明确，从商品资料中提炼 3～5 个真实卖点}。卖点优先级：{由根据目标受众与购买决策价值排序}。其余标注方式、视觉层级与画面表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce feature callout image. Core task: Quickly communicate the most compelling reasons to buy. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Core selling points: {Prioritize user-provided content; if not specified, extract 3-5 authentic selling points from product data}. Priority of selling points: {Rank based on target audience and purchase decision value}. Autonomously determine annotation methods, visual hierarchy, and overall presentation. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="卖点标注图" data-name-zh="卖点标注图" data-name-en="Feature Callout Image" aria-label="查看 EC-005 卖点标注图"><img src="../../../images/layouts/ecommerce/EC-005.webp" alt="EC-005 卖点标注图"><span class="layout-info"><span class="layout-id">EC-005</span><span class="layout-name">卖点标注图</span></span></button>
<button class="layout-card" type="button" data-id="EC-006" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-006.webp" data-prompt="电商功能演示图。核心任务：直观表现商品能做什么，以及核心功能如何作用。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。核心功能：{从用户输入或商品资料提取}。功能作用对象与结果：{仅根据可确认资料总结，不得虚构效果}。其余动作设计、状态表现、功能可视化方式与画面表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商功能演示图。核心任务：直观表现商品能做什么，以及核心功能如何作用。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。核心功能：{从用户输入或商品资料提取}。功能作用对象与结果：{仅根据可确认资料总结，不得虚构效果}。其余动作设计、状态表现、功能可视化方式与画面表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce function demonstration image. Core task: Intuitively demonstrate what the product does and how its core functions operate. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Core function: {Extracted from user input or product data}. Function target and result: {Summarized strictly from verifiable data, do not fabricate effects}. Autonomously design the action, state representation, function visualization method, and overall visual presentation. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="功能演示图" data-name-zh="功能演示图" data-name-en="Function Demonstration Image" aria-label="查看 EC-006 功能演示图"><img src="../../../images/layouts/ecommerce/EC-006.webp" alt="EC-006 功能演示图"><span class="layout-info"><span class="layout-id">EC-006</span><span class="layout-name">功能演示图</span></span></button>
<button class="layout-card" type="button" data-id="EC-007" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-007.webp" data-prompt="电商参数尺寸图。核心任务：让用户快速理解影响购买决策的关键规格与尺寸。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。关键参数：{从用户资料中提取真实的尺寸、容量、重量、规格等；没有资料时不得猜测}。参数优先级：{由根据商品类别与购买决策价值筛选}。其余测量关系、信息组织与视觉表达请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商参数尺寸图。核心任务：让用户快速理解影响购买决策的关键规格与尺寸。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。关键参数：{从用户资料中提取真实的尺寸、容量、重量、规格等；没有资料时不得猜测}。参数优先级：{由根据商品类别与购买决策价值筛选}。其余测量关系、信息组织与视觉表达请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce specification and dimension image. Core task: Let users quickly understand critical specifications and dimensions that influence buying decisions. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Key specifications: {Extract genuine dimensions, capacity, weight, specs, etc., from user data; do not guess if data is missing}. Specification priority: {Filter based on product category and purchase decision value}. Autonomously design measurement relations, information layout, and visual presentation. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="参数尺寸图" data-name-zh="参数尺寸图" data-name-en="Specification &amp; Dimension Image" aria-label="查看 EC-007 参数尺寸图"><img src="../../../images/layouts/ecommerce/EC-007.webp" alt="EC-007 参数尺寸图"><span class="layout-info"><span class="layout-id">EC-007</span><span class="layout-name">参数尺寸图</span></span></button>
<button class="layout-card" type="button" data-id="EC-008" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-008.webp" data-prompt="电商材质与结构解析图。核心任务：解释商品由什么构成，以及材质、结构或组成为什么重要。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。材质、组成或结构信息：{从用户输入或商品资料中提取；可根据商品类型自动理解为配方、面料、部件、层级、内部结构等}。其余剖面、分层、局部放大、爆炸展开等视觉表达方式请自主选择。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商材质与结构解析图。核心任务：解释商品由什么构成，以及材质、结构或组成为什么重要。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。材质、组成或结构信息：{从用户输入或商品资料中提取；可根据商品类型自动理解为配方、面料、部件、层级、内部结构等}。其余剖面、分层、局部放大、爆炸展开等视觉表达方式请自主选择。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce material and structure analysis image. Core task: Explain what the product is made of, and why its materials, structure, or composition matter. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Material, composition, or structural information: {Extracted from user input or product data; interpret appropriately as ingredients, fabrics, components, layers, or internal structure depending on product type}. Autonomously select visual techniques such as cross-sections, exploded views, layering, or callout blowups. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="材质 / 结构解析图" data-name-zh="材质 / 结构解析图" data-name-en="Material / Structure Exploded Image" aria-label="查看 EC-008 材质 / 结构解析图"><img src="../../../images/layouts/ecommerce/EC-008.webp" alt="EC-008 材质 / 结构解析图"><span class="layout-info"><span class="layout-id">EC-008</span><span class="layout-name">材质 / 结构解析图</span></span></button>
<button class="layout-card" type="button" data-id="EC-009" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-009.webp" data-prompt="电商生活方式场景图。核心任务：让用户自然想象拥有和使用商品后的生活状态。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料与受众总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。生活情境：{若用户已指定则使用；否则由根据商品用途、受众和品牌调性概括最合适的生活情境}。其余人物、环境、时间、光线、道具和氛围请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商生活方式场景图。核心任务：让用户自然想象拥有和使用商品后的生活状态。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料与受众总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。生活情境：{若用户已指定则使用；否则由根据商品用途、受众和品牌调性概括最合适的生活情境}。其余人物、环境、时间、光线、道具和氛围请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce lifestyle scenario image. Core task: Enable users to naturally envision their lifestyle after owning and using the product. Audience: {Input by user, or summarized based on product positioning and data}. Theme: {Input by user, or summarized based on product data and audience}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Lifestyle setting: {Use if specified by user; otherwise summarize the most suitable setting based on product use, audience, and brand tone}. Autonomously design the characters, environment, time of day, lighting, props, and overall atmosphere. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="生活方式场景图" data-name-zh="生活方式场景图" data-name-en="Lifestyle Scenario Image" aria-label="查看 EC-009 生活方式场景图"><img src="../../../images/layouts/ecommerce/EC-009.webp" alt="EC-009 生活方式场景图"><span class="layout-info"><span class="layout-id">EC-009</span><span class="layout-name">生活方式场景图</span></span></button>
<button class="layout-card" type="button" data-id="EC-010" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-010.webp" data-prompt="电商人物使用图。核心任务：清晰展示人与商品之间的真实使用关系。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。使用者：{由用户指定；未指定时由根据目标受众概括}。使用动作：{由用户指定，或根据商品真实用途总结}。其余人物姿态、镜头、场景和交互表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商人物使用图。核心任务：清晰展示人与商品之间的真实使用关系。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。使用者：{由用户指定；未指定时由根据目标受众概括}。使用动作：{由用户指定，或根据商品真实用途总结}。其余人物姿态、镜头、场景和交互表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce in-use demonstration image. Core task: Clearly showcase the genuine usage relationship between user and product. Audience: {Input by user, or summarized based on product positioning and data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. User persona: {Specified by user; if unspecified, summarize based on target audience}. Usage action: {Specified by user, or summarized based on genuine product usage}. Autonomously design character pose, camera framing, scene setting, and interactive expression. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="人物使用图" data-name-zh="人物使用图" data-name-en="In-Use Demonstration Image" aria-label="查看 EC-010 人物使用图"><img src="../../../images/layouts/ecommerce/EC-010.webp" alt="EC-010 人物使用图"><span class="layout-info"><span class="layout-id">EC-010</span><span class="layout-name">人物使用图</span></span></button>
<button class="layout-card" type="button" data-id="EC-011" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-011.webp" data-prompt="电商多场景适用图。核心任务：展示同一商品在多个典型场景中的适用性。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。主要使用场景：{优先使用用户提供场景；未提供时由根据商品用途和目标受众总结 3～5 个最典型场景}。其余场景组织、画面节奏与统一视觉表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商多场景适用图。核心任务：展示同一商品在多个典型场景中的适用性。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。主要使用场景：{优先使用用户提供场景；未提供时由根据商品用途和目标受众总结 3～5 个最典型场景}。其余场景组织、画面节奏与统一视觉表现请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce multi-scenario application image. Core task: Showcase the versatility and applicability of the same product across multiple representative scenarios. Audience: {Input by user, or summarized based on product positioning and data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Key usage scenarios: {Prioritize user-provided scenarios; if not provided, summarize 3-5 typical scenarios based on product utility and target audience}. Autonomously determine scene arrangement, visual rhythm, and cohesive presentation. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="多场景适用图" data-name-zh="多场景适用图" data-name-en="Multi-Scenario Application Image" aria-label="查看 EC-011 多场景适用图"><img src="../../../images/layouts/ecommerce/EC-011.webp" alt="EC-011 多场景适用图"><span class="layout-info"><span class="layout-id">EC-011</span><span class="layout-name">多场景适用图</span></span></button>
<button class="layout-card" type="button" data-id="EC-012" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-012.webp" data-prompt="电商使用步骤或教程图。核心任务：让用户快速理解商品如何正确使用。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。使用步骤：{从用户说明、说明书或商品资料中提取并整理为清晰顺序；不得编造关键操作}。注意事项：{仅提取有依据的信息}。其余步骤画面、动作视角与流程组织请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商使用步骤或教程图。核心任务：让用户快速理解商品如何正确使用。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。商品主体：{由用户指定、参考图识别或商品资料提取}。使用步骤：{从用户说明、说明书或商品资料中提取并整理为清晰顺序；不得编造关键操作}。注意事项：{仅提取有依据的信息}。其余步骤画面、动作视角与流程组织请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce usage steps or tutorial image. Core task: Allow users to quickly grasp how to use the product properly. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. Product subject: {Specified by user, recognized from reference image, or extracted from product data}. Usage steps: {Extract from user instructions, manuals, or product data into a clear sequence; do not fabricate key actions}. Precautions: {Extract only verifiable information}. Autonomously design step illustrations, action perspectives, and workflow layout. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="使用步骤 / 教程图" data-name-zh="使用步骤 / 教程图" data-name-en="Usage Steps / Tutorial Image" aria-label="查看 EC-012 使用步骤 / 教程图"><img src="../../../images/layouts/ecommerce/EC-012.webp" alt="EC-012 使用步骤 / 教程图"><span class="layout-info"><span class="layout-id">EC-012</span><span class="layout-name">使用步骤 / 教程图</span></span></button>
<button class="layout-card" type="button" data-id="EC-013" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-013.webp" data-prompt="电商对比优势图。核心任务：让用户快速理解本商品与其他方案之间的关键差异。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。本商品：{由用户指定、参考图识别或商品资料提取}。对比对象：{由用户指定；未指定时只能基于用户资料中已有的对比对象进行总结，不得虚构竞品信息}。比较维度：{从资料中提取真实差异，并根据购买决策价值排序}。其余对比结构与视觉表达请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商对比优势图。核心任务：让用户快速理解本商品与其他方案之间的关键差异。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。本商品：{由用户指定、参考图识别或商品资料提取}。对比对象：{由用户指定；未指定时只能基于用户资料中已有的对比对象进行总结，不得虚构竞品信息}。比较维度：{从资料中提取真实差异，并根据购买决策价值排序}。其余对比结构与视觉表达请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce comparative advantage image. Core task: Allow users to quickly understand key differentiators between this product and alternative options. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. This product: {Specified by user, recognized from reference image, or extracted from product data}. Comparison target: {Specified by user; if unspecified, summarize only from existing comparison targets in user data, do not fabricate competitor info}. Comparison criteria: {Extract genuine differences from data and rank by purchase decision value}. Autonomously design comparison layout structure and visual expression. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="对比优势图" data-name-zh="对比优势图" data-name-en="Comparative Advantage Image" aria-label="查看 EC-013 对比优势图"><img src="../../../images/layouts/ecommerce/EC-013.webp" alt="EC-013 对比优势图"><span class="layout-info"><span class="layout-id">EC-013</span><span class="layout-name">对比优势图</span></span></button>
<button class="layout-card" type="button" data-id="EC-014" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-014.webp" data-prompt="电商型号与 SKU 差异图。核心任务：帮助用户快速区分不同颜色、尺寸、容量、配置或型号。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。SKU / 型号列表：{从用户资料中提取}。各版本主要差异：{由根据真实资料整理，不得推测不存在的区别}。其余版本陈列、分组与信息层级请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商型号与 SKU 差异图。核心任务：帮助用户快速区分不同颜色、尺寸、容量、配置或型号。受众：{由用户输入，或根据商品与用户资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。SKU / 型号列表：{从用户资料中提取}。各版本主要差异：{由根据真实资料整理，不得推测不存在的区别}。其余版本陈列、分组与信息层级请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce model and SKU comparison image. Core task: Help users quickly distinguish between different colors, sizes, capacities, configurations, or models. Audience: {Input by user, or summarized based on product and user data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. SKU / model list: {Extracted from user data}. Key differences between versions: {Organized based on authentic data; do not infer non-existent differences}. Autonomously arrange version showcase, grouping, and information hierarchy. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="型号 / SKU 差异图" data-name-zh="型号 / SKU 差异图" data-name-en="Model / SKU Comparison Image" aria-label="查看 EC-014 型号 / SKU 差异图"><img src="../../../images/layouts/ecommerce/EC-014.webp" alt="EC-014 型号 / SKU 差异图"><span class="layout-info"><span class="layout-id">EC-014</span><span class="layout-name">型号 / SKU 差异图</span></span></button>
<button class="layout-card" type="button" data-id="EC-015" data-category="ecommerce" data-image="../../../images/layouts/ecommerce/EC-015.webp" data-prompt="电商适配与选择指南图。核心任务：帮助用户判断哪一种商品、规格或版本最适合自己。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。用户条件：{由用户输入，或根据目标受众总结常见选择条件}。选择维度：{从真实资料中提取，如尺码、容量、设备、使用场景、需求等}。推荐关系：{根据用户资料中的规则整理；无依据时不得自行建立硬性推荐关系}。其余选择路径与视觉表达请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-zh="电商适配与选择指南图。核心任务：帮助用户判断哪一种商品、规格或版本最适合自己。受众：{由用户输入，或根据商品定位与资料总结}。主题：{由用户输入，或根据商品资料总结}。文案：{由用户提供资料或者根据商品自行推断设计}。用户条件：{由用户输入，或根据目标受众总结常见选择条件}。选择维度：{从真实资料中提取，如尺码、容量、设备、使用场景、需求等}。推荐关系：{根据用户资料中的规则整理；无依据时不得自行建立硬性推荐关系}。其余选择路径与视觉表达请自主完成。场景和周边元素可以采用指定画风，但是必须保持商品的写实风格。" data-prompt-en="E-commerce fit and selection guide image. Core task: Help users determine which product, specification, or edition best suits their needs. Audience: {Input by user, or summarized based on product positioning and data}. Theme: {Input by user, or summarized based on product data}. Copy: {Provided by user materials or inferred and designed based on the product}. User conditions: {Input by user, or summarized based on common conditions of target audience}. Selection dimensions: {Extracted from genuine data, such as sizing, capacity, compatible devices, usage scenarios, needs, etc.}. Recommendation logic: {Organized based on rules in user data; do not establish rigid recommendations without evidence}. Autonomously design selection pathways and visual representation. Background scenes and surrounding elements may adopt the specified artistic style, but the product itself must strictly maintain a realistic photographic style." data-name="适配 / 选择指南图" data-name-zh="适配 / 选择指南图" data-name-en="Fit / Selection Guide Image" aria-label="查看 EC-015 适配 / 选择指南图"><img src="../../../images/layouts/ecommerce/EC-015.webp" alt="EC-015 适配 / 选择指南图"><span class="layout-info"><span class="layout-id">EC-015</span><span class="layout-name">适配 / 选择指南图</span></span></button>
