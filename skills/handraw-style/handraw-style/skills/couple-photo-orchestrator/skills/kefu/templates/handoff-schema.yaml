look_group_confirmation:
  status: confirmed
  confirmation_source: direction_selected  # direction_selected | ai_auto_selected | user_override
  rule: Selecting A/B/C is sufficient authorization for the selected direction. Do not ask for a second Group Look confirmation. In card_draw, the AI-selected legal direction auto-confirms the downstream Look.
handoff_to_photography_skill:
  ready: false
  confirmation_rule: 'Ready becomes true when the selected direction is fixed, every participant has a complete outfit, hairstyle_design and makeup_design, and the selected direction styling is locked. No second user confirmation is required.'
  next_task: Create an eight-shot photography plan while preserving all participant identities, identity mappings, locked outfits, locked hairstyles and locked makeup designs.
