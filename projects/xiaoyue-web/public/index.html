<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小易伴侣 - 真实 AI 对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .header-left p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-image: url('xiaoyi-avatar.png'); background-color: #f0f0f0; background-size: cover; background-position: center;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        
        .message.user .avatar {
            background: #667eea;
        }
        
        .message.ai .avatar {
            background-image: url('xiaoyi-avatar.png'); background-color: #f0f0f0; background-size: cover; background-position: center;
        }
        
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.ai .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .message-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .message-image:hover {
            transform: scale(1.02);
        }
        
        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-dots {
            display: flex;
            gap: 6px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        
        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .quick-action {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .quick-action:hover {
            background: #667eea;
            color: white;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .chat-input:focus {
            border-color: #667eea;
        }
        
        .send-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <h1>小易伴侣</h1>
                <p>真实 AI 对话和图片生成</p>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText">连接中...</span>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="avatar"></div>
                <div class="message-content">
                    你好！我是小易，你的 AI 伴侣 😊<br><br>
                    我可以：<br>
                    📸 生成真实的场景图片<br>
                    💬 和你自然对话<br>
                    🎯 帮你完成各种任务<br><br>
                    试试下面的快捷操作吧！               </div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <div class="quick-actions">
                <button class="quick-action" onclick="sendQuickMessage('发张你在咖啡馆的照片')">📸 咖啡馆</button>
                <button class="quick-action" onclick="sendQuickMessage('发张你在办公室的照片')">💼 办公室</button>
                <button class="quick-action" onclick="sendQuickMessage('你在做什么？')">💬 聊天</button>
                <button class="quick-action" onclick="sendQuickMessage('今天心情怎么样？')">😊 心情</button>
            </div>
            
            <div class="input-wrapper">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="输入消息...按 Enter 发送"
                    onkeypress="handleKeyPress(event)"
                >
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    发送
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusText = document.getElementById('statusText');
        
        // 检查服务器状态
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    if (data.hasApiKey) {
                        statusText.textContent = '在线';
                    } else {
                        statusText.textContent = '需要配置';
                        addSystemMessage(`⚠️ Please configure the ${data.provider || 'MiniMax'} API key on the server before using this service.`);
                    }
                }
            } catch (error) {
                statusText.textContent = '离线';
                addSystemMessage('❌ 无法连接到服务器，请确保服务器正在运行');
            }
        }
        
        function addSystemMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'error-message';
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addMessage(content, type, image = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            // 用户显示 emoji，AI 显示图片（通过 CSS background-image）
            if (type === 'user') {
                avatar.textContent = '👤';
            }
            // AI 头像通过 CSS 显示图片，不设置 textContent
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content.replace(/\n/g, '<br>');
            
            if (image) {
                const img = document.createElement('img');
                // 添加时间戳防止浏览器缓存
                img.src = image + '?t=' + Date.now();
                img.className = 'message-image';
                img.alt = 'Generated image';
                img.onclick = () => window.open(image, '_blank');
                contentDiv.appendChild(img);
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            
            typingDiv.innerHTML = `
                <div class="avatar"></div>
                <div class="typing-indicator active">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // 添加用户消息
            addMessage(message, 'user');
            messageInput.value = '';
            sendButton.disabled = true;
            
            // 显示输入中
            showTyping();
            
            try {
                // 调用对话 API
                const chatResponse = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });
                
                const chatData = await chatResponse.json();
                hideTyping();
                
                console.log('[DEBUG] Chat response:', chatData);
                
                if (!chatData.success) {
                    const errorMsg = chatData.error || chatData.message || '未知错误';
                    addSystemMessage(`错误: ${errorMsg}`);
                    sendButton.disabled = false;
                    return;
                }
                
                // 添加AI回复
                addMessage(chatData.message, 'ai');
                
                // 如果需要显示照片
                if (chatData.needImage) {
                    console.log('[DEBUG] needImage=true, photoUrl=', chatData.photoUrl);
                    // 如果后端已经返回了照片URL，直接使用
                    if (chatData.photoUrl) {
                        console.log('[DEBUG] 使用后端返回的photoUrl:', chatData.photoUrl);
                        addMessage('', 'ai', chatData.photoUrl);
                    } else {
                        // 否则调用图片生成接口
                        showTyping();
                        
                        // 判断场景（作为回退）
                        let scene = 'coffee-shop';
                        if (message.includes('办公室') || message.includes('工作')) {
                            scene = 'office';
                        } else if (message.includes('餐厅') || message.includes('美食') || message.includes('户外') || message.includes('旅行') || message.includes('家') || message.includes('家里')) {
                            scene = 'home';
                        } else if (message.includes('健身') || message.includes('运动')) {
                            scene = 'gym';
                        } else if (message.includes('公园') || message.includes('户外')) {
                            scene = 'park';
                        }
                        
                        // 传递用户消息作为 prompt，让后端智能匹配照片
                        const imageResponse = await fetch(`${API_BASE}/api/generate-image`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ 
                                prompt: message,  // 传递用户消息
                                scene: scene 
                            })
                        });
                        
                        const imageData = await imageResponse.json();
                        hideTyping();
                        
                        if (imageData.success) {
                            addMessage('', 'ai', imageData.imageUrl);
                        } else {
                            const errorMsg = imageData.error || imageData.message || '未知错误';
                            addSystemMessage(`图片加载失败: ${errorMsg}`);
                        }
                    }
                }
                
            } catch (error) {
                hideTyping();
                addSystemMessage(`请求失败: ${error.message}`);
            }
            
            sendButton.disabled = false;
            messageInput.focus();
        }
        
        function sendQuickMessage(message) {
            messageInput.value = message;
            sendMessage();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 初始化
        checkHealth();
        messageInput.focus();
    </script>
</body>
</html>
