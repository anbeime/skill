<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地技能库 - Local Skills</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>💾 本地技能库</h1>
            <p class="subtitle" id="subtitle">精选策展的中文 Agent 技能</p>
            <nav>
                <a href="index.html">官方技能商店</a>
                <a href="local-skills.html" class="active">本地技能库</a>
                <a href="projects.html">项目展示</a>
                <a href="https://github.com/anbeime/skill" target="_blank">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="stats" id="stats">
            <!-- 统计卡片由 JS 根据数据生成 -->
            <div class="stat-card"><h3>…</h3><p>加载中</p></div>
        </section>

        <section class="filters">
            <h2>🔍 筛选技能</h2>
            <div class="filter-buttons">
                <input type="text" id="search-input" placeholder="按名称搜索…"
                       style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;min-width:220px;">
                <select id="category-select">
                    <option value="all">所有分类</option>
                </select>
            </div>
        </section>

        <section class="skills-list" id="skills-container">
            <h2>📦 技能列表</h2>
            <div id="skills-grid" class="skills-grid">
                <div class="loading">加载中...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Skill Store · 数据文件 local_skills.json 由 scripts/sync_frontend.py 自动同步</p>
        </div>
    </footer>

    <script>
        let ALL_DATA = null;

        async function loadSkills() {
            try {
                const response = await fetch('/data/local_skills.json');
                ALL_DATA = await response.json();
                renderStats();
                renderCategoryOptions();
                renderSkills();
            } catch (error) {
                console.error('加载技能数据失败:', error);
                document.getElementById('skills-grid').innerHTML =
                    '<p class="error">加载失败，请刷新页面重试</p>';
            }
        }

        function renderStats() {
            const m = ALL_DATA.metadata || {};
            const total = m.total_skills || 0;
            const nCats = Object.keys(ALL_DATA.categories || {}).length;
            const nDetails = Object.keys(ALL_DATA.skill_details || {}).length;
            document.getElementById('subtitle').textContent =
                `精选策展的中文 Agent 技能 · 最后同步 ${m.last_updated || '—'}`;
            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><h3>${total}</h3><p>技能总数</p></div>
                <div class="stat-card"><h3>${nCats}</h3><p>分类</p></div>
                <div class="stat-card"><h3>${nDetails}</h3><p>含详细介绍</p></div>`;
        }

        function renderCategoryOptions() {
            const sel = document.getElementById('category-select');
            Object.keys(ALL_DATA.categories || {}).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `${cat} (${ALL_DATA.categories[cat].count})`;
                sel.appendChild(opt);
            });
            sel.addEventListener('change', renderSkills);
            document.getElementById('search-input').addEventListener('input', renderSkills);
        }

        function renderSkills() {
            const container = document.getElementById('skills-grid');
            const cat = document.getElementById('category-select').value;
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            container.innerHTML = '';
            const details = ALL_DATA.skill_details || {};

            let shown = 0;
            for (const [catName, group] of Object.entries(ALL_DATA.categories || {})) {
                if (cat !== 'all' && cat !== catName) continue;
                const matched = group.skills.filter(name =>
                    !q || name.toLowerCase().includes(q) ||
                    (details[name] && JSON.stringify(details[name]).toLowerCase().includes(q)));
                if (!matched.length) continue;

                const h = document.createElement('h3');
                h.style.margin = '24px 0 12px';
                h.textContent = `${catName}（${matched.length}/${group.skills.length}）`;
                container.appendChild(h);

                const grid = document.createElement('div');
                grid.className = 'skills-grid';
                matched.forEach(name => {
                    grid.appendChild(createSkillCard(name, catName, details[name]));
                    shown++;
                });
                container.appendChild(grid);
            }
            if (!shown) {
                container.innerHTML = '<p class="error">没有匹配的技能</p>';
            }
        }

        function createSkillCard(name, catName, d) {
            const card = document.createElement('div');
            card.className = 'skill-card';
            card.dataset.category = catName;
            const desc = d ? (d.description_cn || d.description_en || '') : '';
            const titleEn = d && d.title_en ? ` <small style="color:#6b7280">${d.title_en}</small>` : '';
            card.innerHTML = `
                <div class="skill-header"><h3>${name}${titleEn}</h3></div>
                <p class="category">${catName}</p>
                ${desc ? `<p class="description">${desc}</p>` : ''}`;
            return card;
        }

        document.addEventListener('DOMContentLoaded', loadSkills);
    </script>
</body>
</html>
